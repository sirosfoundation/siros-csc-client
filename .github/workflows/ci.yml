name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/rust-toolchain
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --locked --no-default-features
      - run: cargo check --locked --features ffi

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/rust-toolchain
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked
      - run: cargo test --locked --features test-utils

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/rust-toolchain
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/rust-toolchain
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --locked --all-features -- -D warnings

  msrv:
    name: MSRV (1.86)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      # Both are needed. `rustup toolchain install` *installs* 1.86.0;
      # RUSTUP_TOOLCHAIN (exported below) is what makes cargo use it, because
      # rust-toolchain.toml pins the exact CI toolchain and would otherwise
      # override it, so this job would pass while checking nothing.
      - name: Install the MSRV toolchain
        run: |
          rustup toolchain install 1.86.0 --profile minimal
          # Exported for the whole job so rust-cache (which runs `rustc -vV`)
          # also sees 1.86.0 and does not install the pinned toolchain too.
          echo "RUSTUP_TOOLCHAIN=1.86.0" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
      - name: Crate builds on the MSRV
        run: cargo check --locked --no-default-features
